[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
build_flags = 
    ; Cấu hình TFT_eSPI
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=130
    -D TFT_HEIGHT=131 
    ; Cấu hình chân kết nối TFT
    -D TFT_CS=PA4
    -D TFT_DC=PA0
    -D TFT_RST=PA1
    -D TFT_MOSI=PA7
    -D TFT_SCLK=PA5 
    -D ST7735_REDTAB=1
    -D TFT_RGB_ORDER=TFT_RBG
    -D SPI_FREQUENCY=4000000 
    ; Font
    -D LOAD_GLCD=1
    -D SMOOTH_FONT=1 
    ; Tối ưu cho STM32
    -D CORE_FREQ=72000000L
    -Os
; ✅ CHỈ DÙNG TFT_eSPI, BỎ THƯ VIỆN ADAFRUIT
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
; ✅ BỎ lib_ignore để tránh conflict
lib_ignore = 
    Adafruit BusIO
    Adafruit Unified Sensor
    RTClib
monitor_speed = 115200
monitor_filters = 
    colorize
    time
; Cấu hình debug (tùy chọn)
debug_tool = stlink
debug_init_break = tbreak setup
